name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN. CI only reads the repo — pinning the
# actions is half the supply-chain mitigation; capping what a compromised one
# could do with the token is the other half.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history required so Turborepo can resolve origin/main as a
          # diff base on PRs with merge commits (fetch-depth: 2 is too shallow).
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Filter against the merge base on PRs; run everything on push to main.
      - name: Lint
        run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

      - name: Typecheck
        run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

      - name: Test
        run: pnpm turbo run test ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

      - name: Build
        run: pnpm turbo run build ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}
        env:
          # Make the bundle-budget check hard-fail here if it cannot measure
          # (renamed manifest, changed Next output shape). CI is where that
          # should surface; Vercel deliberately keeps the warn-and-continue
          # behaviour so a tooling break never blocks a production deploy.
          BUNDLE_BUDGET_STRICT: "1"
          # MVP CI doesn't talk to MongoDB/R2 during build; provide a dummy
          # URI so the env Zod parser passes. Real values land in Vercel
          # at deploy time (DEPLOYMENT.md).
          MONGODB_URI: mongodb://localhost:27017/ci
          AUTH_SECRET: ci-only-dummy-secret-that-is-thirty-two-or-more-chars
          NEXT_TELEMETRY_DISABLED: 1

  audit:
    name: pnpm audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory, not a gate: a transitive dependency with a known advisory and
    # no upstream fix yet (common in a fast-moving JS ecosystem) would
    # otherwise wedge every future merge until some third party ships a patch
    # we don't control. `continue-on-error` keeps the job green in the PR
    # checks list while the step output still surfaces every finding in the
    # Actions log for a human to triage. --prod scopes to what actually ships
    # (devDependencies don't run in production); --audit-level=high drops
    # low/moderate noise so the signal stays worth reading.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit --prod
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
